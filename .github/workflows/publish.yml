name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify release tag
        run: |
          node --input-type=module -e "import p from './package.json' with { type: 'json' }; if ('v' + p.version !== process.env.GITHUB_REF_NAME) throw new Error('Release tag must match package version')"
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public --provenance
