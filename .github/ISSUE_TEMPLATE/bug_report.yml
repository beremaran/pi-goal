name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the smallest useful reproduction.
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: Pi version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or transcript excerpt
      description: Remove credentials and private data.
